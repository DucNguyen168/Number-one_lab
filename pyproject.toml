[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xsmb-research-lab"
version = "0.1.0"
description = "Personal XSMB data collection, prediction snapshots, and walk-forward evaluation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pymongo>=4.10,<5.0",
  "python-dotenv>=1.0,<2.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
]

[project.scripts]
xsmb-lab = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

